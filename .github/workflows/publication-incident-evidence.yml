name: Publication incident evidence

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character published commit that is not release-ready
        required: true
        type: string
      failed_run_id:
        description: Exact failed post-publication evidence run; never rerun it
        required: true
        type: string
      failed_run_attempt:
        description: Exact failed run attempt; use 1 for the original rc.1 failure
        required: true
        default: '1'
        type: string
      previous_commit:
        description: Exact previous commit with a successful release-ready receipt
        required: true
        type: string
      previous_evidence_run_id:
        description: Exact successful previous post-publication evidence run
        required: true
        type: string
      previous_evidence_run_attempt:
        description: Exact successful previous evidence run attempt
        required: true
        default: '1'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  record-incident:
    name: Bind immutable Release to terminal not-release-ready evidence
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected main verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Bind incident coordinates to protected main history
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
          PREVIOUS_COMMIT: ${{ inputs.previous_commit }}
          PREVIOUS_EVIDENCE_RUN_ID: ${{ inputs.previous_evidence_run_id }}
          PREVIOUS_EVIDENCE_RUN_ATTEMPT: ${{ inputs.previous_evidence_run_attempt }}
          VERIFIER_COMMIT: ${{ github.sha }}
        run: |
          for commit in "$TARGET_COMMIT" "$PREVIOUS_COMMIT" "$VERIFIER_COMMIT"; do
            case "$commit" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#commit}" -eq 40
          done
          for run in "$FAILED_RUN_ID" "$FAILED_RUN_ATTEMPT" "$PREVIOUS_EVIDENCE_RUN_ID" "$PREVIOUS_EVIDENCE_RUN_ATTEMPT"; do
            case "$run" in *[!0-9]*|''|0*) exit 1 ;; esac
          done
          test "$TARGET_COMMIT" != "$PREVIOUS_COMMIT"
          test "$FAILED_RUN_ID" != "$PREVIOUS_EVIDENCE_RUN_ID"
          test "$FAILED_RUN_ID" != "$GITHUB_RUN_ID"
          test "$PREVIOUS_EVIDENCE_RUN_ID" != "$GITHUB_RUN_ID"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$(git rev-parse HEAD)" = "$VERIFIER_COMMIT"
          git merge-base --is-ancestor "$PREVIOUS_COMMIT" "$TARGET_COMMIT"
          git merge-base --is-ancestor "$TARGET_COMMIT" "$VERIFIER_COMMIT"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Prove protected-main verifier exact CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/acceptance/github-ci
          node acceptance/release/verify-github-ci.mjs \
            --commit "$GITHUB_SHA" \
            --receipt .artifacts/acceptance/github-ci/incident-verifier.json
          echo "VERIFIER_CI_SHA=sha256:$(sha256sum .artifacts/acceptance/github-ci/incident-verifier.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Verify failed publication and write terminal incident receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.commit }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
          PREVIOUS_COMMIT: ${{ inputs.previous_commit }}
          PREVIOUS_EVIDENCE_RUN_ID: ${{ inputs.previous_evidence_run_id }}
          PREVIOUS_EVIDENCE_RUN_ATTEMPT: ${{ inputs.previous_evidence_run_attempt }}
        run: |
          node acceptance/release/assert-publication-incident.mjs \
            --commit "$TARGET_COMMIT" \
            --failed-run-id "$FAILED_RUN_ID" \
            --failed-run-attempt "$FAILED_RUN_ATTEMPT" \
            --previous-commit "$PREVIOUS_COMMIT" \
            --previous-evidence-run-id "$PREVIOUS_EVIDENCE_RUN_ID" \
            --previous-evidence-run-attempt "$PREVIOUS_EVIDENCE_RUN_ATTEMPT" \
            --verifier-commit "$GITHUB_SHA" \
            --verifier-run-id "$GITHUB_RUN_ID" \
            --verifier-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --verifier-ref-protected "$GITHUB_REF_PROTECTED" \
            --verifier-ci-receipt .artifacts/acceptance/github-ci/incident-verifier.json \
            --verifier-ci-receipt-sha256 "$VERIFIER_CI_SHA" \
            --receipt .artifacts/acceptance/publication-incident/receipt.json
          jq -e \
            '.schemaVersion == 1
              and .acceptanceId == "P0-EXTENSION-CENTER-PUBLICATION-INCIDENT"
              and .status == "failed"
              and .p0Status == "not-release-ready"
              and .releaseReadyAcceptanceId == null
              and .failure.releaseReadyReceiptPresent == false
              and .failure.releaseReadyCompositeConclusion == "skipped"
              and (.receiptDigest | test("^sha256:[0-9a-f]{64}$"))' \
            .artifacts/acceptance/publication-incident/receipt.json >/dev/null
      - name: Upload immutable incident receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-incident-${{ inputs.commit }}-failed-run-${{ inputs.failed_run_id }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/acceptance/publication-incident/receipt.json
            .artifacts/acceptance/github-ci/incident-verifier.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: true
          retention-days: 90
