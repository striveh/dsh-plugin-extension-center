name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }} source, package, and committed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and behavior
        run: pnpm test
      - name: Verify committed distribution artifacts
        run: git diff --exit-code -- lib
      - name: Verify deterministic publication artifact
        run: pnpm run verify:pack
      - name: Upload exact-commit deterministic pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == '22.19.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/release-candidate/*.tgz
            .artifacts/release-candidate/SHA256SUMS
            .artifacts/release-candidate/pack-attestation.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  rc2-acceptance:
    name: Official rc.2 Store and plugin-only lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release-candidate inputs
        run: pnpm run build
      - name: Verify committed distribution artifacts
        run: git diff --exit-code -- lib
      - name: Verify deterministic publication artifact
        run: pnpm run verify:pack
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - name: Verify packed Store discovery
        run: pnpm run test:acceptance:store
      - name: Verify packed Center lifecycle on official rc.2
        run: pnpm run test:acceptance:official-rc2
      - name: Upload acceptance and release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rc2-acceptance-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/acceptance/store-only/**
            .artifacts/acceptance/full-p0-official-rc2/**
            .artifacts/release-candidate/**
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0

  plugin-only-release-gate:
    name: Official rc.2 plugin-only release gate
    if: always()
    needs: [verify, rc2-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every source and official-runtime lane
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RC2_ACCEPTANCE_RESULT: ${{ needs.rc2-acceptance.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$RC2_ACCEPTANCE_RESULT" = success
