name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }} source, package, and committed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and behavior
        run: pnpm test
      - name: Verify committed distribution artifacts
        run: git diff --exit-code -- lib
      - name: Verify deterministic packed artifact
        run: pnpm run verify:pack
      - name: Upload exact-commit deterministic pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == '22.19.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/release-candidate/*.tgz
            .artifacts/release-candidate/SHA256SUMS
            .artifacts/release-candidate/pack-attestation.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  latest-dsh-compatibility:
    name: Latest official DSH packed-plugin compatibility
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Warm the offline pnpm cache for the packed plugin graph
        # STORE-UI-01 installs the packed tarball with `dsh plugin add --offline`.
        # pnpm resolves the tarball's runtime dependencies from its metadata mirror
        # and content-addressable store even though the tarball itself is local,
        # so a cold mirror/store makes the offline install fail with
        # ERR_PNPM_NO_OFFLINE_META / ERR_PNPM_NO_OFFLINE_TARBALL before the Host Web
        # process ever starts. Resolve the exact packed runtime dependencies online
        # once here, outside the checkout so the lane's clean-worktree check holds;
        # the acceptance lane itself remains strictly offline.
        run: |
          # Exact runtime dependencies declared by the packed artifact (package.json).
          # Fail closed if they change, so the warm-up never silently goes stale.
          expected="@deepseek-ai/dsh-mcp-client@0.1.2-alpha.3 pnpm@11.21.0 yaml@2.9.0"
          actual="$(node -e "const d=require('./package.json').dependencies||{};process.stdout.write(Object.entries(d).map(([n,v])=>n+'@'+v).join(' '))")"
          test "$actual" = "$expected" || {
            echo "::error::packed runtime dependencies changed; update the CI warm-up step and the offline acceptance lane"
            exit 1
          }
          warm_root="$RUNNER_TEMP/dsh-extension-center-cache-warm"
          mkdir -p "$warm_root"
          printf '{\n  "private": true\n}\n' > "$warm_root/package.json"
          (cd "$warm_root" && pnpm add $expected --save-exact --ignore-scripts)
      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Prove standard packed-plugin install and Host plus Client boot
        run: pnpm run test:compat:latest
      - name: Upload exact compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: latest-dsh-compatibility-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .artifacts/acceptance/store-only
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0

  alpha-source-package-gate:
    name: Source, pack, and latest DSH compatibility checkpoint
    if: always()
    needs: [verify, latest-dsh-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source and package lane
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          COMPATIBILITY_RESULT: ${{ needs.latest-dsh-compatibility.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
